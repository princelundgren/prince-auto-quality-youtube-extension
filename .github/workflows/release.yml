name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node --test
      - name: Check the tag is on main and matches the manifest version
        run: |
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "::error::$GITHUB_REF_NAME isn't on main."; exit 1; }
          version="v$(node -p 'require("./manifest.json").version')"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME, manifest $version."; exit 1; }
      - name: Build the store package and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="prince-auto-quality-youtube-extension-$GITHUB_REF_NAME.zip"
          git archive --format=zip -o "$zip" "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "$zip" --verify-tag --generate-notes
