<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prince Auto Quality for YouTube</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px system-ui, sans-serif; margin: 12px; min-width: 220px; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      select { width: 100%; font: inherit; padding: 4px; }
      p { margin: 8px 0 0; opacity: 0.7; font-size: 12px; }
    </style>
  </head>
  <body>
    <label for="quality">Start videos at</label>
    <select id="quality"></select>
    <p>Applies to the next video you open.</p>
    <script src="quality.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
